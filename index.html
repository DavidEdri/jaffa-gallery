<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaffa Art Salon</title>

    <!-- SEO -->

    <link rel="canonical" href="https://jaffa-art-salon.com/" />

    <!-- Open Graph (WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jaffa-art-salon.com/" />
    <meta property="og:title" content="סלון האמנות — יפו" />
    <meta property="og:description" content="סלון אמנות פרטי בלב יפו העתיקה, אל מול הים התיכון. מרחב ייחודי למפגשים עסקיים ותרבותיים בעלי משמעות." />
    <meta property="og:image" content="https://jaffa-art-salon.com/assets/hero.jpg" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="סלון האמנות — יפו" />

  </head>
  <body>
    <script>
      (function () {
        var l = localStorage.getItem("lang");
        if (!l) l = (navigator.language || "").startsWith("he") ? "he" : "en";
        if (l === "he") {
          document.documentElement.lang = "he";
          document.documentElement.dir = "rtl";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
